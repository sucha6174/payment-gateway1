version: "1.0"
metadata:
  candidate_name: "KALARI SRISUCHA"
  repository_url: "https://github.com/sucha6174/payment-gateway1"
  submission_date: "2026-09-03"

setup:
  - name: "Check Docker Daemon"
    command: "docker --version && docker compose version"

start:
  - name: "Start Gateway Services"
    command: "docker compose up -d --build"
  - name: "Wait for API Health"
    command: "docker compose ps"

test:
  - name: "Run Backend Unit Tests"
    command: "python tests/run_tests.py unit"

verify:
  - name: "Job Queue Status Check"
    command: "curl -s -f http://localhost:8000/api/v1/test/jobs/status"
  - name: "End-to-End Workflow Verification"
    command: "python tests/e2e_verification.py"

shutdown:
  - name: "Stop Gateway Services"
    command: "docker compose down -v"
