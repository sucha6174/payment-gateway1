<!DOCTYPE html>
<html>
<head>
  <title>Payment History</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f7fa;
      padding: 20px;
      text-align: center;
    }

    table {
      width: 80%;
      margin: auto;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }

    th {
      background: #4CAF50;
      color: white;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>📊 Payment History</h2>

<table id="historyTable">
  <tr>
    <th>ID</th>
    <th>Amount</th>
    <th>Status</th>
  </tr>
</table>

<button onclick="goBack()">⬅ Back</button>

<script>
function goBack() {
  window.location.href = "index.html";
}

// get data from localStorage
let payments = JSON.parse(localStorage.getItem("payments")) || [];

const table = document.getElementById("historyTable");

payments.forEach(p => {
  const row = `
    <tr>
      <td>${p.id}</td>
      <td>₹${p.amount}</td>
      <td>${p.status}</td>
    </tr>
  `;
  table.innerHTML += row;
});
</script>

</body>
</html>
