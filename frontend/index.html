<!DOCTYPE html>
<html>
<head>
  <title>Payment Gateway</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: green;
      color: white;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .pending {
      color: orange;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>💳 Payment Gateway</h2>

  <input type="text" id="amount" placeholder="Amount" />
  <input type="text" id="orderId" placeholder="Order ID" />

  <button onclick="makePayment()">Pay Now</button>

  <div id="result"></div>

 <button onclick="toggleHistory()">📊 View Payment History</button>

<div id="historySection" style="display:none;">
  <h3>Payment History</h3>

  <table id="historyTable">
    <tr>
      <th>ID</th>
      <th>Amount</th>
      <th>Status</th>
    </tr>
  </table>
</div>

<script>
let payments = [];

async function makePayment() {
  const amount = document.getElementById("amount").value;
  const orderId = document.getElementById("orderId").value;

  const response = await fetch("http://127.0.0.1:8000/api/v1/payments", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Api-Key": "key_test_abc123",
      "X-Api-Secret": "secret_test_xyz789"
    },
    body: JSON.stringify({
      amount: parseInt(amount),
      currency: "INR",
      method: "upi",
      order_id: orderId,
      vpa: "test@upi"
    })
  });

  const data = await response.json();

  document.getElementById("result").innerHTML = `
    <p><b>ID:</b> ${data.id}</p>
    <p id="status" class="pending">Status: ${data.status}</p>
  `;

  // add payment
  payments.push({
    id: data.id,
    amount: data.amount,
    status: "pending"
  });

  updateTable();

  // simulate success
  setTimeout(() => {
    payments = payments.map(p =>
      p.id === data.id ? { ...p, status: "SUCCESS" } : p
    );

    document.getElementById("status").innerHTML = "Status: SUCCESS";
    document.getElementById("status").className = "success";

    updateTable();
  }, 5000);
}

function updateTable() {
  const table = document.getElementById("historyTable");

  table.innerHTML = `
    <tr>
      <th>ID</th>
      <th>Amount</th>
      <th>Status</th>
    </tr>
  `;

  payments.forEach(p => {
    table.innerHTML += `
      <tr>
        <td>${p.id}</td>
        <td>₹${p.amount}</td>
        <td class="${p.status === 'SUCCESS' ? 'success' : 'pending'}">
          ${p.status}
        </td>
      </tr>
    `;
  });
}

function toggleHistory() {
  const section = document.getElementById("historySection");

  if (section.style.display === "none") {
    section.style.display = "block";
  } else {
    section.style.display = "none";
  }
}

</script>

</body>
</html>
