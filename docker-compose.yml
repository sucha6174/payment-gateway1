version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_gateway
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_pass
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_gateway
    command: redis-server --protected-mode no
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gateway_api
    ports:
      - "8000:8000"
    restart: always
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      SPRING_DATASOURCE_USERNAME: gateway_user
      SPRING_DATASOURCE_PASSWORD: gateway_pass
      REDIS_URL: redis://redis:6379
      PORT: 8000
      SPRING_PROFILES_ACTIVE: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/test/jobs/status || wget -q -O - http://localhost:8000/api/v1/test/jobs/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 25s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: gateway_worker
    restart: always
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      SPRING_DATASOURCE_USERNAME: gateway_user
      SPRING_DATASOURCE_PASSWORD: gateway_pass
      REDIS_URL: redis://redis:6379
      SPRING_PROFILES_ACTIVE: worker
      TEST_MODE: "true"
      TEST_PROCESSING_DELAY: "1000"
      TEST_PAYMENT_SUCCESS: "true"
      WEBHOOK_RETRY_INTERVALS_TEST: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: gateway_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MERCHANT_API_KEY: key_test_abc123
      MERCHANT_API_SECRET: secret_test_xyz789
    depends_on:
      api:
        condition: service_healthy

  checkout:
    build:
      context: ./checkout-widget
      dockerfile: Dockerfile
    container_name: gateway_checkout
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
